name: QA

on:
  pull_request:
  push:

jobs:
  test-and-analysis:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and pinned QA tools
        run: python -m pip install . -r requirements-qa.txt
      - name: Verify intended pytest discovery
        run: python -m pytest --collect-only -q
      - name: Run suite excluding KNOWN-FLAKE-001
        run: >-
          python -m pytest tests -q
          --deselect=tests/test_operation_ledger_m3.py::OperationLedgerTests::test_purge_removes_old_terminal_rows_but_never_active_rows
      - name: KNOWN-FLAKE-001 diagnostic (non-blocking)
        continue-on-error: true
        run: >-
          python -m pytest tests/test_operation_ledger_m3.py::OperationLedgerTests::test_purge_removes_old_terminal_rows_but_never_active_rows -q
      - name: Pyright production baseline diagnostic (non-blocking)
        continue-on-error: true
        run: pyright --project pyrightconfig.json
