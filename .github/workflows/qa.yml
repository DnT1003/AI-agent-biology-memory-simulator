name: QA

on:
  pull_request:
  push:

jobs:
  test-and-analysis:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and pinned QA tools
        run: python -m pip install . -r requirements-qa.txt
      - name: Verify intended pytest discovery
        run: python -m pytest --collect-only -q
      # Temporary quarantines: A3 owns removal. Remove KNOWN-FLAKE-002 only after
      # a deterministic same-time/clock-rollback insertion-order regression,
      # 50 consecutive Windows passes of its exact node, and a full suite green
      # run after removing only its deselection. Do not weaken the frozen runtime test.
      - name: Run suite excluding KNOWN-FLAKE-001 and KNOWN-FLAKE-002
        run: >-
          python -m pytest tests -q
          --deselect=tests/test_operation_ledger_m3.py::OperationLedgerTests::test_purge_removes_old_terminal_rows_but_never_active_rows
          --deselect=tests/test_dream_operation_ledger_m3.py::DreamOperationLedgerTests::test_bad_pending_operation_does_not_starve_next_valid_plan
      - name: KNOWN-FLAKE-001 diagnostic (non-blocking)
        continue-on-error: true
        run: >-
          python -m pytest tests/test_operation_ledger_m3.py::OperationLedgerTests::test_purge_removes_old_terminal_rows_but_never_active_rows -q
      - name: KNOWN-FLAKE-002 diagnostic (non-blocking)
        continue-on-error: true
        run: >-
          python -m pytest tests/test_dream_operation_ledger_m3.py::DreamOperationLedgerTests::test_bad_pending_operation_does_not_starve_next_valid_plan -q
      - name: Pyright production baseline diagnostic (non-blocking)
        continue-on-error: true
        run: pyright --project pyrightconfig.json
