apiVersion: v1
kind: ConfigMap
metadata:
  name: aura-config
  namespace: aura
data:
  # ChromaDB
  CHROMA_SERVER_HOST: "aura-chromadb-svc"
  CHROMA_SERVER_PORT: "8000"
  USE_CHROMA_SERVER: "true"

  # GPU Service (NanoGPT SLM)
  GPU_SERVICE_URL: "http://aura-gpu-svc:8001"
  AURA_SLM_ENABLED: "false"
  AURA_SLM_TRAINING_ENABLED: "false"
  SLM_MODEL_DIR: "/app/slm"
  SLM_MODEL_PATH: "/app/slm/aura_flash_v5.pth"

  # Brain image is CPU-only; do not pretend the CUDA/Unsloth Gemma backend is ready.
  # A future GPU inference endpoint should own this capability.
  AURA_LOCAL_LLM_ENABLED: "false"

  # Canonical name, deliberately pointed at the existing legacy physical root.
  AURA_DATA_DIR: "/app/outputs"
  # Legacy consumers remain authoritative until explicit promotion.
  AURA_OUTPUT_DIR: "/app/outputs"
  # Release abandoned browser responses after one day so the outbox cannot
  # remain backpressured forever when a tab disappears without ACKing.
  AURA_CHAT_RESPONSE_RETENTION_SECONDS: "86400"

  # Embedding
  EMBEDDING_DIM: "1024"

  # Bio-thresholds (có thể override per-environment)
  AURA_PING_THRESHOLD: "60"
  AURA_ANXIETY_THRESHOLD: "21600"
  AURA_STM_MAX: "15"
  AURA_COGNITIVE_TICK_INTERVAL_SECONDS: "30"
  AURA_DEFER_REPLIES_WHILE_ASLEEP: "false"
