apiVersion: v1
kind: ConfigMap
metadata:
  name: aura-config
  namespace: aura
data:
  # ChromaDB
  CHROMA_SERVER_HOST: "aura-chromadb-svc"
  CHROMA_SERVER_PORT: "8000"
  USE_CHROMA_SERVER: "true"

  # GPU Service (NanoGPT SLM)
  GPU_SERVICE_URL: "http://aura-gpu-svc:8001"

  # Ollama local LLM (phi3:mini)
  OLLAMA_URL: "http://aura-ollama-svc:11434/api"
  LOCAL_MODEL_NAME: "phi3:mini"

  # Output dir
  AURA_OUTPUT_DIR: "/app/outputs"

  # Embedding
  EMBEDDING_DIM: "1024"

  # Bio-thresholds (có thể override per-environment)
  AURA_PING_THRESHOLD: "60"
  AURA_ANXIETY_THRESHOLD: "600"
  AURA_STM_MAX: "15"
