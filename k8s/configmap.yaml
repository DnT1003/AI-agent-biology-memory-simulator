apiVersion: v1
kind: ConfigMap
metadata:
  name: aura-config
  namespace: aura
data:
  # ChromaDB
  CHROMA_SERVER_HOST: "aura-chromadb-svc"
  CHROMA_SERVER_PORT: "8000"
  USE_CHROMA_SERVER: "true"

  # GPU Service (NanoGPT SLM)
  GPU_SERVICE_URL: "http://aura-gpu-svc:8001"

  # Local LLM — Gemma 4 E4B (Unsloth, 4-bit)
  # Model được mount vào container qua PVC; path trong container là /app/models/Gemma4_E4B
  GEMMA_MODEL_PATH: "/app/models/Gemma4_E4B"

  # Output dir
  AURA_OUTPUT_DIR: "/app/outputs"

  # Embedding
  EMBEDDING_DIM: "1024"

  # Bio-thresholds (có thể override per-environment)
  AURA_PING_THRESHOLD: "60"
  AURA_ANXIETY_THRESHOLD: "600"
  AURA_STM_MAX: "15"
