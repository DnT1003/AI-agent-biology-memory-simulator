    path: /mnt/c/aura/chroma_db
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chroma-pvc
  namespace: aura
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  resources:
    requests:
      storage: 10Gi

---
# --- 3. gemma-pvc (model weights Gemma 4 E4B, ~11GB) ---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: gemma-pv
  namespace: aura
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    # Windows: d:\python\PythonProject19\Gemma4_E4B → /mnt/d/python/PythonProject19/Gemma4_E4B
    path: /mnt/d/python/PythonProject19/Gemma4_E4B
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gemma-pvc
  namespace: aura
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  resources:
    requests:
      storage: 20Gi

---
