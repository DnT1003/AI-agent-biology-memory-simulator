# ================================================================
# STORAGE PVCs - SUA DUNG HOSTPATH DE TRANH YEU CAU RWX
# Thich hop cho 1-node deployment (Docker Desktop / minikube)
# ================================================================

# --- 1. brain-pvc (RWX via hostPath) ---
# Chia se giua aura-brain va aura-dashboard
apiVersion: v1
kind: PersistentVolume
metadata:
  name: brain-pv
  namespace: aura
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany   # OK voi hostPath tren 1 node
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /mnt/c/aura/outputs   # Docker Desktop (WSL2): C:\aura\outputs → /mnt/c/aura/outputs
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: brain-pvc
  namespace: aura
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: manual
  resources:
    requests:
      storage: 5Gi

---
