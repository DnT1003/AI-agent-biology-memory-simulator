# ================================================================
# OLLAMA DEPLOYMENT + SERVICE
# Local LLM runner cho phi3:mini fallback
# GPU: ~2.3GB VRAM (phi3:mini Q4)
# ================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aura-ollama
  namespace: aura
  labels:
    app: aura-ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aura-ollama
  template:
    metadata:
      labels:
        app: aura-ollama
    spec:
      # Pull model phi3:mini truoc khi Ollama server chay
      initContainers:
        - name: pull-phi3
          image: ollama/ollama:latest
          command:
            - sh
            - -c
            - |
              echo "Kiem tra model phi3:mini..."
              ollama serve &
              sleep 5
              if ! ollama list | grep -q phi3; then
                echo "Dang pull phi3:mini (lan dau co the mat 5-10 phut)..."
                ollama pull phi3:mini
              fi
              echo "phi3:mini san sang!"
          env:
            - name: OLLAMA_MODELS
              value: /root/.ollama/models
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
          resources:
            limits:
              nvidia.com/gpu: "1"
              memory: "2Gi"
            requests:
              memory: "512Mi"

      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          env:
            - name: OLLAMA_MODELS
              value: /root/.ollama/models
            - name: OLLAMA_HOST
              value: "0.0.0.0"
            # Gioi han VRAM de cung song voi aura-gpu
            - name: CUDA_VISIBLE_DEVICES
              value: "0"
          resources:
            limits:
              nvidia.com/gpu: "1"   # Dung time-slicing de chia se voi aura-gpu
              memory: "6Gi"
              cpu: "4000m"
            requests:
              memory: "2Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
      volumes:
        - name: ollama-data
          persistentVolumeClaim:
            claimName: ollama-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: aura-ollama-svc
  namespace: aura
spec:
  selector:
    app: aura-ollama
  ports:
    - protocol: TCP
      port: 11434
      targetPort: 11434
  type: ClusterIP
