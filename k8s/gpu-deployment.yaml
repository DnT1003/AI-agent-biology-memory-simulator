apiVersion: apps/v1
kind: Deployment
metadata:
  name: aura-gpu-deploy
  namespace: default
  labels:
    app: aura-gpu-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aura-gpu-svc
  template:
    metadata:
      labels:
        app: aura-gpu-svc
    spec:
      containers:
        - name: gpu-service
          image: aura/gpuservice:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8001
          # Yeu cau 1 GPU tu worker node K8s co NVIDIA driver
          resources:
            limits:
              nvidia.com/gpu: "1"
              memory: "6Gi"
              cpu: "4000m"
            requests:
              memory: "4Gi"
              cpu: "1000m"

---
apiVersion: v1
kind: Service
metadata:
  name: aura-gpu-svc
spec:
  selector:
    app: aura-gpu-svc
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001
  type: ClusterIP
