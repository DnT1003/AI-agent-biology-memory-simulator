apiVersion: apps/v1
kind: Deployment
metadata:
  name: aura-gpu-deploy
  namespace: default
  labels:
    app: aura-gpu-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aura-gpu-svc
  template:
    metadata:
      labels:
        app: aura-gpu-svc
    spec:
      containers:
        - name: gpu-service
          image: aura/gpuservice:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8001
          resources:
            limits:
              nvidia.com/gpu: "1"
              memory: "6Gi"
              cpu: "4000m"
            requests:
              memory: "4Gi"
              cpu: "1000m"
          # FIX: Them livenessProbe - gpu_service.py co san /health endpoint
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 60   # GPU model load mat nhieu thoi gian
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 45
            periodSeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: aura-gpu-svc
  namespace: default  # FIX: them namespace
spec:
  selector:
    app: aura-gpu-svc
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001
  type: ClusterIP
