apiVersion: v1
kind: Secret
metadata:
  name: aura-secrets
  namespace: aura
type: Opaque
stringData:
  # Thay YOUR_REAL_API_KEY bang API key that cua ban (Gemini hoac OpenAI).
  # File nay KHONG duoc commit len Git.
  # Chi dung de tao Secret tren Cluster bang lenh:
  #   kubectl apply -f k8s/aura-secrets.yaml
  API_KEY: "YOUR_REAL_API_KEY"
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  # M4.1a / M4.1b Service Auth Tokens (ASCII 32..256 char base64url/token68)
  # Sinh bang: python -c "import secrets; print(secrets.token_urlsafe(32))"
  AURA_DASHBOARD_AUTH_TOKEN: ""
  AURA_GPU_SERVICE_AUTH_TOKEN: ""
  # Shared journal integrity key. Generate a distinct value; never reuse a
  # service authentication token or commit the populated Secret manifest.
  AURA_EVENT_JOURNAL_HMAC_KEY: ""
