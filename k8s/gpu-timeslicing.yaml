# ================================================================
# NVIDIA GPU TIME-SLICING CONFIG
# Cho phep cac pod chia se 1 GPU RTX 3060
# Apply: kubectl apply -f k8s/gpu-timeslicing.yaml
# ================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: nvidia-device-plugin-config
  namespace: kube-system
data:
  config.yaml: |
    version: v1
    flags:
      migStrategy: none
    sharing:
      timeSlicing:
        resources:
          - name: nvidia.com/gpu
            replicas: 2   # Chia RTX 3060 thanh 2 "virtual GPU"
