apiVersion: apps/v1
kind: Deployment
metadata:
  name: aura-brain
  namespace: default
  labels:
    app: aura-brain
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aura-brain
  template:
    metadata:
      labels:
        app: aura-brain
    spec:
      # FIX: Them initContainers de Brain cho Chroma san sang truoc khi khoi dong
      initContainers:
        - name: wait-for-chroma
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              echo "Cho Chroma khoi dong..."
              until curl -sf http://aura-chromadb-svc:8000/api/v1/heartbeat; do
                echo "Chroma chua san sang, thu lai sau 5 giay..."
                sleep 5
              done
              echo "Chroma da san sang!"
      containers:
        - name: brain
          image: aura/brain:latest
          imagePullPolicy: Never
          tty: true
          stdin: true
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: aura-secrets
                  key: API_KEY
            - name: CHROMA_SERVER_HOST
              value: aura-chromadb-svc
            # FIX: Them CHROMA_SERVER_PORT de tuong minh
            - name: CHROMA_SERVER_PORT
              value: "8000"
            - name: GPU_SERVICE_URL
              value: http://aura-gpu-svc:8001
            - name: AURA_OUTPUT_DIR
              value: /app/outputs
          resources:
            limits:
              memory: "1Gi"
              cpu: "1000m"
            requests:
              memory: "256Mi"
              cpu: "500m"
          volumeMounts:
            - name: brain-storage
              mountPath: /app/outputs
      volumes:
        - name: brain-storage
          persistentVolumeClaim:
            claimName: brain-pvc
