apiVersion: apps/v1
kind: Deployment
metadata:
  name: aura-brain
  namespace: aura
  labels:
    app: aura-brain
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aura-brain
  template:
    metadata:
      labels:
        app: aura-brain
    spec:
      # FIX: Them initContainers de Brain cho Chroma san sang truoc khi khoi dong
      initContainers:
        - name: wait-for-chroma
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              echo "Cho Chroma khoi dong..."
              until curl -sf http://aura-chromadb-svc:8000/api/v1/heartbeat; do
                echo "Chroma chua san sang, thu lai sau 5 giay..."
                sleep 5
              done
              echo "Chroma da san sang!"
      containers:
        - name: brain
          image: aura/brain:latest
          imagePullPolicy: Never
          tty: true
          stdin: true
          # Nap tat ca bien moi truong chung tu ConfigMap
          envFrom:
            - configMapRef:
                name: aura-config
          env:
            # Secret rieng (API keys)
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: aura-secrets
                  key: API_KEY
          resources:
            limits:
              memory: "2Gi"
              cpu: "2000m"
            requests:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: brain-storage
              mountPath: /app/outputs
            # SLM weights chia se voi aura-gpu
            - name: slm-storage
              mountPath: /app/core/engine/nanogpt
      volumes:
        - name: brain-storage
          persistentVolumeClaim:
            claimName: brain-pvc
        - name: slm-storage
          persistentVolumeClaim:
            claimName: gpu-pvc
