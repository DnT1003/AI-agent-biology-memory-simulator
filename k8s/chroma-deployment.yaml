apiVersion: apps/v1
kind: Deployment
metadata:
  name: aura-chromadb
  namespace: default
  labels:
    app: aura-chromadb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aura-chromadb
  template:
    metadata:
      labels:
        app: aura-chromadb
    spec:
      containers:
        - name: chromadb
          image: aura/chromadb:latest
          imagePullPolicy: Never  # Do build ở máy local
          ports:
            - containerPort: 8000
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "128Mi"
              cpu: "250m"
          volumeMounts:
            - name: chroma-data
              mountPath: /chroma_data
      volumes:
        - name: chroma-data
          persistentVolumeClaim:
            claimName: chroma-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: aura-chromadb-svc
spec:
  selector:
    app: aura-chromadb
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
