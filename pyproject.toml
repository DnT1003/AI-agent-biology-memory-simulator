[project]
name = "aura-biology-simulator"
version = "0.1.0"
description = "A biological/cognitive AI simulator prototype"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "chromadb>=0.4.0",
    "google-genai>=0.1.0",
    "numpy>=1.24.0",
    "colorama>=0.4.0",
    "tenacity>=8.2.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "transformers>=4.38.0",
    "torch>=2.2.0",
    "sentencepiece>=0.1.0",
    "beautifulsoup4>=4.12.0",
    "cloudscraper>=1.2.0",
    "prompt-toolkit>=3.0.0",
    "Pillow>=10.0.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
include = ["core*", "components*"]
exclude = ["test*", "tests*"]
