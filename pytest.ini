[pytest]
testpaths =
    tests
python_files =
    test_*.py
norecursedirs =
    .git
    .github
    .agents
    .codex
    .venv
    .venv_aura
    .venv-aura-qa
    venv
    env
    __pycache__
    .pytest_cache
    .mypy_cache
    .pyright
    test
    scripts
addopts =
    --ignore=scripts/test_generation.py
